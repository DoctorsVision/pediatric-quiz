<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小児科羅針盤｜臨床クイズ 小児看護師編</title>
<style>
:root{
  --bg:#fffaf6;--card:#fff;--ink:#3f4a56;--muted:#7f8a95;
  --accent:#6fb8b0;--accent2:#f2ad9b;--line:#e9e5df;
  --ok:#5ea37b;--ng:#cf6d6d;--shadow:0 10px 30px rgba(70,70,70,.08)
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  background:radial-gradient(circle at 12% 5%,rgba(242,173,155,.14),transparent 22%),
             radial-gradient(circle at 88% 0%,rgba(111,184,176,.14),transparent 24%),var(--bg);
  color:var(--ink)
}
.wrap{max-width:820px;margin:auto;padding:22px 16px 48px}
.hero{background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:26px;padding:26px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-25px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(246,217,143,.22)}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;background:#edf8f6;color:#4d8e87;font-size:13px;font-weight:700}
h1{font-size:clamp(25px,5vw,38px);margin:12px 0 8px;letter-spacing:.02em}
.sub{color:var(--muted);line-height:1.8;margin:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{font-size:12px;padding:7px 10px;border-radius:999px;background:#f7f5f1;color:#6f777f}
.progressWrap{margin:20px 0 12px}
.progressTop{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress{height:10px;background:#ece9e4;border-radius:999px;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#91cfc8);transition:.25s}
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:22px;margin-top:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qno{font-size:13px;color:var(--accent);font-weight:800}
.cat{font-size:11px;padding:5px 9px;border-radius:999px;background:#fff1ec;color:#a66d60;font-weight:700}
.qtitle{font-size:20px;line-height:1.6;margin:8px 0 6px;font-weight:800}
.qtype{font-size:12px;color:var(--muted);margin-bottom:14px}
.options{display:grid;gap:10px}
.option{width:100%;text-align:left;border:1.5px solid #e8e4de;background:#fff;border-radius:15px;padding:14px 15px;font-size:15px;line-height:1.55;cursor:pointer;transition:.15s;color:var(--ink)}
.option:hover{border-color:#b8dcd7;background:#fbfffe}
.option.selected{border-color:var(--accent);background:#eff9f7}
.option.correct{border-color:var(--ok);background:#eef8f1}
.option.wrong{border-color:var(--ng);background:#fff0f0}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button.main,button.subbtn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;font-size:14px}
button.main{background:var(--accent);color:white}
button.main:disabled{opacity:.45;cursor:not-allowed}
button.subbtn{background:#f1efeb;color:#66717a}
.explain{margin-top:16px;padding:15px 16px;border-radius:15px;background:#f8f7f4;line-height:1.7;font-size:14px;display:none}
.explain.show{display:block}
.result{display:none;text-align:center;padding:30px 20px}
.score{font-size:54px;font-weight:900;color:var(--accent);margin:6px 0}
.small{font-size:13px;color:var(--muted);line-height:1.7}
.footer{text-align:center;color:#9a9a9a;font-size:12px;margin-top:24px;line-height:1.7}
.note{margin-top:14px;padding:12px 14px;background:#fff7df;border:1px solid #f2dfab;border-radius:14px;color:#78683e;font-size:12px;line-height:1.6}
@media(max-width:560px){.wrap{padding:14px 12px 34px}.hero{padding:21px 17px}.card{padding:18px 15px}.qtitle{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
  <span class="badge">小児科羅針盤</span>
  <h1>臨床クイズ｜小児看護師編</h1>
  <p class="sub">全100問の問題バンクから、アクセスするたびに20問をランダム出題。観察・初期対応・安全管理・家族支援を中心に学べます。</p>
  <div class="meta">
    <span class="chip">問題バンク 全100問</span>
    <span class="chip">毎回ランダム20問</span>
    <span class="chip">選択肢もシャッフル</span>
    <span class="chip">複数選択あり</span>
  </div>
  <div class="note">※教育用クイズです。実際の診療・看護では、院内手順・担当医の指示・最新のガイドラインを優先してください。</div>
</section>

<div class="progressWrap" id="progressWrap">
  <div class="progressTop"><span id="counter">1 / 20</span><span id="scoreMini">正解 0</span></div>
  <div class="progress"><div id="bar"></div></div>
</div>

<section class="card" id="quizCard">
  <div class="qhead"><div class="qno" id="qno"></div><div class="cat" id="cat"></div></div>
  <div class="qtitle" id="question"></div>
  <div class="qtype" id="qtype"></div>
  <div class="options" id="options"></div>
  <div class="actions">
    <button class="main" id="answerBtn" disabled>回答する</button>
    <button class="subbtn" id="nextBtn" style="display:none">次の問題へ</button>
  </div>
  <div class="explain" id="explain"></div>
</section>

<section class="card result" id="result">
  <div class="qno">RESULT</div>
  <div class="score" id="finalScore"></div>
  <div id="resultMsg" class="qtitle"></div>
  <p class="small">「もう一度挑戦」で、100問から別の20問がランダム出題されます。</p>
  <button class="main" onclick="restart()">もう一度挑戦</button>
</section>

<div class="footer">小児科羅針盤｜臨床クイズ 小児看護師編</div>
</div>

<script>
const ALL_QUIZ = [{"cat":"呼吸","q":"乳児の呼吸状態を観察する際、努力呼吸の所見として確認したいものはどれ？","type":"single","opts":["陥没呼吸","爪の長さ","耳垢の量","足底の色だけ"],"ans":[0],"exp":"乳幼児では呼吸仕事量が増えると鎖骨上窩・肋間・肋骨弓下などの陥没がみられます。呼吸数、呻吟、鼻翼呼吸、SpO₂などと合わせて評価します。"},{"cat":"呼吸","q":"喘鳴を伴う小児の観察で重要な項目をすべて選んでください。","type":"multi","opts":["呼吸数と陥没呼吸","会話・啼泣の様子","SpO₂と顔色","喘鳴の音量だけ"],"ans":[0,1,2],"exp":"呼吸障害は呼吸数、努力呼吸、会話・啼泣、SpO₂、顔色、意識などを総合的に評価します。喘鳴が弱くても重症化している場合があります。"},{"cat":"呼吸","q":"SpO₂が急に低下したとき、最初に確認したいこととして適切なのはどれ？","type":"single","opts":["児の状態とプローブ装着・波形","数値だけ記録して終了","必ず採血してから再測定","モニターの電源を切る"],"ans":[0],"exp":"まず児の呼吸・顔色・意識などを確認し、同時にプローブ位置、体動、末梢循環、波形など測定条件を確認します。"},{"cat":"救急","q":"けいれん中の初期対応として適切なものをすべて選んでください。","type":"multi","opts":["安全を確保して気道・呼吸を観察する","開始時刻と持続時間を確認する","口に物を入れる","顔色や左右差を観察する"],"ans":[0,1,3],"exp":"けいれん時は安全確保、気道・呼吸、持続時間、左右差などを観察します。口腔内へ物を入れるのは外傷や窒息の原因になるため避けます。"},{"cat":"救急","q":"アナフィラキシーを疑う小児で優先度が高い観察はどれ？","type":"single","opts":["気道・呼吸・循環の評価","身長測定","視力検査","歯の本数確認"],"ans":[0],"exp":"アナフィラキシーでは気道狭窄、呼吸障害、循環不全が急速に進行し得るためABCの評価が優先されます。"},{"cat":"救急","q":"小児の急変時、SBARで報告する内容をすべて選んでください。","type":"multi","opts":["現在の状況","関連する背景","自分の評価","必要と考える対応・依頼"],"ans":[0,1,2,3],"exp":"SBARはSituation、Background、Assessment、Recommendationの枠組みで、急変時の情報共有を簡潔に行う方法です。"},{"cat":"呼吸","q":"クループを疑う小児で観察したい症状として適切なのはどれ？","type":"single","opts":["犬吠様咳嗽や吸気性喘鳴","血尿のみ","片脚の腫脹のみ","便秘のみ"],"ans":[0],"exp":"クループでは犬吠様咳嗽、嗄声、吸気性喘鳴、陥没呼吸などを認めることがあります。安静時の喘鳴や呼吸困難は重症度評価で重要です。"},{"cat":"呼吸","q":"呼吸困難のある小児の体位として一般に配慮したいことはどれ？","type":"single","opts":["本人が呼吸しやすい姿勢を保つ","必ず仰臥位に固定する","うつ伏せに固定する","立位を禁止する"],"ans":[0],"exp":"呼吸困難時は児が楽に呼吸できる姿勢を尊重します。状態に応じて上体を起こすなどし、無理に特定の体位へ固定しません。"},{"cat":"救急","q":"意識状態が悪化した小児で、最初に確認したいものはどれ？","type":"single","opts":["気道・呼吸・循環","食事の好み","宿題の有無","視力だけ"],"ans":[0],"exp":"意識障害ではまずABCを確認し、低酸素、循環不全、低血糖など緊急性の高い原因を念頭に評価します。"},{"cat":"救急","q":"窒息予防として適切なものをすべて選んでください。","type":"multi","opts":["年齢に合った食形態にする","食事中の姿勢をみる","小さな物を手の届く場所に置く","食べながら走らせない"],"ans":[0,1,3],"exp":"窒息予防には食形態、姿勢、見守り、誤飲物の管理が重要です。食べながらの歩行・走行も避けます。"},{"cat":"感染","q":"発熱している小児で体温以外に観察したい項目をすべて選んでください。","type":"multi","opts":["意識・活気","呼吸状態","水分摂取と尿量","体温の数字だけ"],"ans":[0,1,2],"exp":"発熱の重症度は体温の高さだけでは判断できません。全身状態、呼吸、循環、水分摂取、尿量などを総合的に評価します。"},{"cat":"感染","q":"感染対策として手指衛生が特に必要なタイミングはどれ？","type":"single","opts":["患者に触れる前後","勤務開始時だけ","昼休みだけ","退勤時だけ"],"ans":[0],"exp":"手指衛生は患者接触の前後、清潔操作前、体液曝露後など適切なタイミングで行います。"},{"cat":"感染","q":"標準予防策の考え方として正しいものはどれ？","type":"single","opts":["すべての患者の血液・体液等を感染性があるものとして扱う","感染症確定者だけに行う","小児には不要","手袋をすれば手指衛生は不要"],"ans":[0],"exp":"標準予防策は感染症の有無にかかわらずすべての患者に適用します。手袋着用後も手指衛生は必要です。"},{"cat":"感染","q":"嘔吐・下痢のある患児で環境整備上大切なことはどれ？","type":"single","opts":["汚染部位を適切な方法で清掃・消毒する","汚染物をそのまま放置する","共用タオルを使う","手洗いを省略する"],"ans":[0],"exp":"嘔吐物や便で環境が汚染された場合は、原因病原体を考慮し院内手順に従って清掃・消毒します。"},{"cat":"感染","q":"隔離が必要な感染症患者の対応で大切なことをすべて選んでください。","type":"multi","opts":["必要な個人防護具を使う","病室表示や動線を確認する","家族にも必要な説明をする","隔離中は観察を減らす"],"ans":[0,1,2],"exp":"隔離中も通常どおり適切な観察を続けます。PPE、動線、家族への説明などを院内手順に沿って行います。"},{"cat":"感染","q":"発熱した乳児で受診・報告を急ぐべき所見として適切なのはどれ？","type":"single","opts":["反応が乏しく哺乳が著しく低下している","普段通りに飲み機嫌もよい","遊べている","尿量が普段通り"],"ans":[0],"exp":"乳児の活気低下、反応低下、哺乳不良は重要な警告所見です。年齢や状態に応じて速やかな評価が必要です。"},{"cat":"感染","q":"予防接種後の観察で特に注意したい症状はどれ？","type":"single","opts":["呼吸困難や全身じんましん","軽い注射部位の痛みのみ","少し眠そうなだけ","泣いたこと自体"],"ans":[0],"exp":"接種後に呼吸困難、全身じんましん、ぐったりなどが出現した場合は重篤なアレルギー反応を考え迅速に対応します。"},{"cat":"感染","q":"感染症流行時の家族指導として適切なものをすべて選んでください。","type":"multi","opts":["手洗いの方法を説明する","家庭内でのタオル共用を避ける場面を説明する","症状悪化時の受診目安を伝える","抗菌薬を自己判断で中止・再開するよう勧める"],"ans":[0,1,2],"exp":"家族には衛生行動、家庭内感染予防、悪化時の受診目安などを具体的に伝えます。処方薬の変更は医療者の指示なしに行いません。"},{"cat":"感染","q":"感染予防でマスク着用だけでは不十分な理由として最も適切なのはどれ？","type":"single","opts":["接触感染など他の経路もあるため","マスクは必ず感染を増やすため","小児では意味がないため","手指衛生が危険なため"],"ans":[0],"exp":"感染経路には飛沫・接触などがあり、手指衛生や環境整備、必要なPPEを組み合わせることが重要です。"},{"cat":"感染","q":"血液や体液が皮膚に付着した場合の基本対応として適切なのはどれ？","type":"single","opts":["速やかに洗浄し、曝露状況を報告する","乾くまで放置する","アルコールだけで済ませ必ず報告しない","勤務終了まで待つ"],"ans":[0],"exp":"体液曝露時は速やかに洗浄し、院内の曝露対応手順に従って報告・評価を受けます。"},{"cat":"消化器","q":"嘔吐を繰り返す乳幼児で脱水を疑う所見として適切なのはどれ？","type":"single","opts":["尿量減少","涙が増える","口腔内が常に湿潤","体重が急に増える"],"ans":[0],"exp":"脱水では尿量低下、口腔粘膜乾燥、涙の減少、活気低下などがみられます。"},{"cat":"消化器","q":"胃腸炎で経口補水を進めるときの考え方として適切なものをすべて選んでください。","type":"multi","opts":["少量ずつ頻回に与える","嘔吐後も状態をみながら少量から再開する","一度に大量に飲ませる","尿量や活気も観察する"],"ans":[0,1,3],"exp":"経口補水は少量頻回が基本です。摂取量だけでなく尿量、活気、循環所見も観察します。"},{"cat":"消化器","q":"乳幼児の脱水評価で確認したい項目をすべて選んでください。","type":"multi","opts":["尿量","口腔粘膜","活気","好きな遊びの種類だけ"],"ans":[0,1,2],"exp":"脱水では尿量、粘膜、涙、末梢循環、活気、体重変化などを評価します。"},{"cat":"消化器","q":"腹痛を訴える小児の観察で重要なことはどれ？","type":"single","opts":["痛みの部位・程度・経過と全身状態","身長だけ","髪型だけ","利き手だけ"],"ans":[0],"exp":"腹痛は部位、性状、経過、嘔吐や便、発熱、全身状態などを組み合わせて評価します。"},{"cat":"消化器","q":"血便がみられた小児で看護師がまず行うべきこととして適切なのはどれ？","type":"single","opts":["全身状態を確認し、便の性状を記録・報告する","便を捨てて記録しない","必ず食事を増やす","観察せず翌日まで待つ"],"ans":[0],"exp":"血便では循環状態や腹痛など全身状態を確認し、色・量・性状などを記録して速やかに報告します。"},{"cat":"消化器","q":"腸重積を疑う患児でみられることがある所見はどれ？","type":"single","opts":["間欠的な激しい腹痛","常に無症状","視力低下のみ","頻尿のみ"],"ans":[0],"exp":"腸重積では間欠的な啼泣・腹痛、嘔吐、血便などを認めることがあります。状態悪化時は迅速な評価が必要です。"},{"cat":"消化器","q":"便秘の小児への家族支援として適切なものをすべて選んでください。","type":"multi","opts":["排便習慣を把握する","水分・食事・生活リズムを確認する","排便を強く叱る","処方薬の使用方法を確認する"],"ans":[0,1,3],"exp":"便秘ケアでは排便習慣、食事・水分、生活リズム、薬の使い方などを確認します。叱責は避けます。"},{"cat":"消化器","q":"嘔吐物を観察する際、記録として有用なのはどれ？","type":"single","opts":["回数・量・色・内容","『吐いた』だけ","時間は不要","量は不要"],"ans":[0],"exp":"嘔吐は回数、量、色、胆汁・血液の有無、食事との関係など具体的な記録が評価に役立ちます。"},{"cat":"消化器","q":"経管栄養中の小児で観察したい項目をすべて選んでください。","type":"multi","opts":["呼吸状態","嘔吐や腹部膨満","チューブ位置の確認方法を院内手順に従う","注入中は観察不要"],"ans":[0,1,2],"exp":"経管栄養では誤嚥や消化器症状に注意し、チューブ位置の確認を院内手順に従って行います。"},{"cat":"消化器","q":"経口摂取が低下している小児で看護記録に含めたいものはどれ？","type":"single","opts":["摂取量と尿量","好きな色だけ","テレビ視聴時間だけ","兄弟の人数だけ"],"ans":[0],"exp":"摂取低下時は飲水・食事量、尿量、体重、活気などを継続的に把握することが重要です。"},{"cat":"輸液・薬剤","q":"小児の点滴管理で成人より特に注意したいことはどれ？","type":"single","opts":["少量の流量誤差でも影響が大きくなり得る","輸液量は体格に左右されない","刺入部の観察は不要","輸液ポンプは使わない"],"ans":[0],"exp":"小児は体格が小さく必要輸液量も少ないため、流量誤差の影響を受けやすくなります。"},{"cat":"輸液・薬剤","q":"末梢静 const SESSION_COUNT = 20;
let session=[], current=0, score=0, selected=[], answered=false;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function makeSession(){
  return shuffle(ALL_QUIZ.map((_,i)=>i)).slice(0,SESSION_COUNT);
}
function prepare(){
  session=makeSession();
  current=0;score=0;selected=[];answered=false;
  document.getElementById("result").style.display="none";
  document.getElementById("quizCard").style.display="block";
  document.getElementById("progressWrap").style.display="block";
  render();
}
function render(){
  answered=false;selected=[];
  const q=ALL_QUIZ[session[current]];
  document.getElementById("qno").textContent=`QUESTION ${current+1}`;
  document.getElementById("cat").textContent=q.cat;
  document.getElementById("question").textContent=q.q;
  document.getElementById("qtype").textContent=q.type==="multi" ? "複数選択｜正しいものをすべて選択" : "1つ選択";
  document.getElementById("counter").textContent=`${current+1} / ${SESSION_COUNT}`;
  document.getElementById("scoreMini").textContent=`正解 ${score}`;
  document.getElementById("bar").style.width=`${(current/SESSION_COUNT)*100}%`;
  document.getElementById("answerBtn").disabled=true;
  document.getElementById("answerBtn").style.display="inline-block";
  document.getElementById("nextBtn").style.display="none";
  document.getElementById("explain").className="explain";
  document.getElementById("explain").textContent="";
  const optionOrder=shuffle(q.opts.map((_,i)=>i));
  const box=document.getElementById("options");
  box.innerHTML="";
  optionOrder.forEach(originalIndex=>{
    const b=document.createElement("button");
    b.className="option";
    b.textContent=q.opts[originalIndex];
    b.dataset.idx=originalIndex;
    b.onclick=()=>selectOption(b,q.type,originalIndex);
    box.appendChild(b);
  });
}
function selectOption(el,type,idx){
  if(answered)return;
  if(type==="single"){
    document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
    selected=[idx];el.classList.add("selected");
  }else{
    if(selected.includes(idx)){
      selected=selected.filter(x=>x!==idx);el.classList.remove("selected");
    }else{
      selected.push(idx);el.classList.add("selected");
    }
  }
  document.getElementById("answerBtn").disabled=selected.length===0;
}
document.getElementById("answerBtn").onclick=()=>{
  const q=ALL_QUIZ[session[current]];
  answered=true;
  const a=[...q.ans].sort((x,y)=>x-y).join(",");
  const s=[...selected].sort((x,y)=>x-y).join(",");
  const ok=a===s;
  if(ok)score++;
  document.querySelectorAll(".option").forEach(el=>{
    const idx=Number(el.dataset.idx);
    el.classList.remove("selected");
    if(q.ans.includes(idx))el.classList.add("correct");
    else if(selected.includes(idx))el.classList.add("wrong");
    el.disabled=true;
  });
  const ex=document.getElementById("explain");
  ex.innerHTML=(ok?"<b>◎ 正解！</b><br>":"<b>△ 確認しておこう</b><br>")+q.exp;
  ex.classList.add("show");
  document.getElementById("answerBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-block";
  document.getElementById("scoreMini").textContent=`正解 ${score}`;
  document.getElementById("bar").style.width=`${((current+1)/SESSION_COUNT)*100}%`;
};
document.getElementById("nextBtn").onclick=()=>{
  current++;
  if(current>=SESSION_COUNT)finish();else render();
};
function finish(){
  document.getElementById("quizCard").style.display="none";
  document.getElementById("progressWrap").style.display="none";
  const r=document.getElementById("result");r.style.display="block";
  document.getElementById("finalScore").textContent=`${score} / ${SESSION_COUNT}`;
  const p=score/SESSION_COUNT;
  let msg=p>=.9?"かなり良い仕上がりです":p>=.7?"よくできています":p>=.5?"あと少し。解説を見直そう":"基本項目からもう一度確認しよう";
  document.getElementById("resultMsg").textContent=msg;
}
function restart(){prepare();}
prepare();
</script>
</body>
</html>
