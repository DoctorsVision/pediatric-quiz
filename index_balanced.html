<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="小児科羅針盤｜小児救急100問 実践トレーニング">
<meta property="og:description" content="小児救急の知識定着を目的とした100問の実践トレーニング。">
<title>小児科羅針盤｜小児救急100問 実践トレーニング</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#657083;--accent:#2457c5;--accent2:#0b7b72;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:800px;margin:0 auto;padding:22px 15px 60px}
.hero{background:linear-gradient(135deg,#eaf2ff,#ecfbf6);border:1px solid #dbe7f2;border-radius:24px;padding:22px;margin-bottom:16px}
.eyebrow{font-size:13px;color:var(--accent2);font-weight:800;letter-spacing:.08em}
h1{font-size:28px;line-height:1.4;margin:5px 0 8px}
.sub{color:var(--muted);line-height:1.75;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 9px 28px rgba(20,35,70,.06);padding:20px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3}
.badge.cat{background:#ecfdf5;color:#0f766e}
.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 18px}
.progress>div{height:100%;background:linear-gradient(90deg,#2457c5,#0b7b72);width:0;transition:.25s}
.q{font-weight:800;font-size:20px;line-height:1.65;margin:0 0 10px}
.guide{font-size:13px;color:var(--muted);margin-bottom:15px}
.options{display:grid;gap:10px}
.option{width:100%;text-align:left;border:1px solid #d7dee8;background:#fff;border-radius:14px;padding:14px 15px;font-size:16px;line-height:1.5;cursor:pointer}
.option:hover{background:#f8fafc;border-color:#94a3b8}
.option.selected{border-color:#6b8ca0;background:#eef6fa}
.option.correct{border-color:#86efac;background:#f0fdf4}
.option.wrong{border-color:#fca5a5;background:#fef2f2}
.option:disabled{cursor:default}
.feedback{display:none;margin-top:16px;padding:14px;border-radius:14px;line-height:1.75;font-size:15px}
.feedback.ok{display:block;background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
.feedback.ng{display:block;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef2f7;color:#243447}
.hidden{display:none!important}
.start,.result{text-align:center;padding:10px 0}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.score{font-size:50px;font-weight:900;margin:8px 0 0}
.rank{font-size:19px;font-weight:800;margin:2px 0 15px}
.small{font-size:13px;color:var(--muted);line-height:1.7}
.footer{font-size:12px;color:#7b8493;line-height:1.65;margin-top:15px}
@media(max-width:560px){h1{font-size:25px}.q{font-size:18px}.mode{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="eyebrow">小児科羅針盤</div>
<h1>小児科羅針盤｜小児救急100問 実践トレーニング</h1>
<div class="sub">初期評価、発熱、呼吸、脱水、嘔吐、けいれん、熱中症、外傷、異物、アナフィラキシー、川崎病などを100問で反復学習します。</div>
</section>

<main class="card">
<div id="start" class="start">
  <div class="eyebrow">出題モードを選択</div>
  <h2>答えの場所ではなく、内容で覚える</h2>
  <p class="small">正解位置は1〜5番目に偏らないよう分散し、さらに選択肢の並び順も毎回ランダムです。1つ選ぶ問題、2つ選ぶ問題、複数選択問題を混ぜています。</p>
  <div class="mode">
    <button class="btn primary" onclick="startQuiz(100,false)">100問すべて</button>
    <button class="btn secondary" onclick="startQuiz(20,true)">ランダム20問</button>
  </div>
</div>

<div id="quiz" class="hidden">
  <div class="badges">
    <div id="counter" class="badge"></div>
    <div id="category" class="badge cat"></div>
    <div id="difficulty" class="badge"></div>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div id="question" class="q"></div>
  <div id="guide" class="guide"></div>
  <div id="options" class="options"></div>
  <div class="actions">
    <button id="nextBtn" class="btn primary hidden">次の問題へ</button>
    <button id="quitBtn" class="btn secondary">終了する</button>
  </div>
  <div id="feedback" class="feedback"></div>
</div>

<div id="result" class="result hidden">
  <div class="eyebrow">結果</div>
  <div class="score" id="score"></div>
  <div class="rank" id="rank"></div>
  <div class="small" id="message"></div>
  <div class="actions" style="justify-content:center;margin-top:22px">
    <button id="retryBtn" class="btn secondary">最初に戻る</button>
    <button id="shareBtn" class="btn primary">Xで結果を共有</button>
  </div>
</div>
</main>
<div class="footer">※教育目的のクイズです。実臨床では患者ごとの病態、年齢、施設基準、最新ガイドライン等を踏まえて判断してください。</div>
</div>

let quiz=[],idx=0,score=0,locked=false,selected=[];
const $=id=>document.getElementById(id);

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}
  return b;
}

function startQuiz(n,randomMode){
  quiz=randomMode?shuffle(allQuestions).slice(0,n):[...allQuestions];
  idx=0;score=0;
  $("start").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  render();
}

function render(){
  locked=false;selected=[];
  const item=quiz[idx];
  $("counter").textContent=`第 ${idx+1} 問 / ${quiz.length} 問`;
  $("category").textContent=item.c;
  $("difficulty").textContent=item.d;
  $("bar").style.width=`${(idx/quiz.length)*100}%`;
  $("question").textContent=item.q;
  const need=item.a.length;
  $("guide").textContent=item.type==="multi"
    ? `※ 正しいものを${need}つ選んでください。${need}つ選ぶと自動判定します。`
    : "※ 最も適切なものを1つ選んでください。選ぶとすぐ判定します。";
  $("options").innerHTML="";
  $("feedback").className="feedback";
  $("feedback").textContent="";
  $("nextBtn").classList.add("hidden");

  const order=shuffle([...Array(item.o.length).keys()]);
  order.forEach(orig=>{
    const b=document.createElement("button");
    b.className="option";
    b.textContent=item.o[orig];
    b.dataset.orig=orig;
    b.onclick=()=>selectOption(b,orig,item);
    $("options").appendChild(b);
  });
}

function selectOption(btn,orig,item){
  if(locked)return;

  if(item.type==="single"){
    selected=[orig];
    btn.classList.add("selected");
    judge(item);
    return;
  }

  const need=item.a.length;
  const pos=selected.indexOf(orig);

  if(pos>=0){
    selected.splice(pos,1);
    btn.classList.remove("selected");
    return;
  }

  if(selected.length<need){
    selected.push(orig);
    btn.classList.add("selected");
  }

  if(selected.length===need)judge(item);
}

function judge(item){
  if(locked)return;
  locked=true;

  const correct=[...item.a].sort((a,b)=>a-b);
  const chosen=[...selected].sort((a,b)=>a-b);
  const ok=correct.length===chosen.length && correct.every((v,i)=>v===chosen[i]);

  [...document.querySelectorAll(".option")].forEach(b=>{
    b.disabled=true;
    const orig=Number(b.dataset.orig);
    b.classList.remove("selected");
    if(correct.includes(orig))b.classList.add("correct");
    else if(chosen.includes(orig))b.classList.add("wrong");
  });

  if(ok){
    score++;
    $("feedback").className="feedback ok";
    $("feedback").textContent="○ 正解　"+item.e;
  }else{
    $("feedback").className="feedback ng";
    $("feedback").textContent="× 不正解　"+item.e;
  }

  $("nextBtn").textContent=idx===quiz.length-1?"結果を見る":"次の問題へ";
  $("nextBtn").classList.remove("hidden");
}

$("nextBtn").onclick=()=>{
  idx++;
  if(idx<quiz.length){
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  }else showResult();
};

function showResult(){
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  const p=Math.round(score/quiz.length*100);
  $("score").textContent=`${score} / ${quiz.length}`;

  let rank,msg;
  if(p>=90){rank="小児救急かなり仕上がっています";msg="重要な初期対応と危険所見がよく定着しています。"}
  else if(p>=75){rank="実践レベル";msg="基礎は良好です。間違えた分野を重点的に復習しましょう。"}
  else if(p>=60){rank="あと一歩";msg="PAT、呼吸、脱水、けいれん、嘔吐の危険所見を中心に復習がおすすめです。"}
  else{rank="基礎から反復がおすすめ";msg="まず初期評価と危険所見からランダム20問を繰り返してみましょう。"}

  $("rank").textContent=rank;
  $("message").textContent=`正答率 ${p}％　${msg}`;
  window.scrollTo({top:0,behavior:"smooth"});
}

$("retryBtn").onclick=()=>{
  $("result").classList.add("hidden");
  $("start").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
};

$("quitBtn").onclick=()=>{
  if(confirm("クイズを終了しますか？")){
    $("quiz").classList.add("hidden");
    $("start").classList.remove("hidden");
  }
};

$("shareBtn").onclick=()=>{
  const p=Math.round(score/quiz.length*100);
  const text=`小児科羅針盤｜小児救急100問\n結果：${score}/${quiz.length}問正解（${p}％）\n#小児救急 #小児科羅針盤`;
  const url=location.href.startsWith("http")?location.href:"";
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`,"_blank");
};
